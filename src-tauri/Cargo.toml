[package]
name = "frota"
version = "0.1.0"
description = "Gestão de frota"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "frota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
chrono = "0.4.45"
ureq = "3.4.2"
sha2 = "0.11.1"
minisign-verify = "0.3.0"
semver = "1.0.28"
tauri-plugin-single-instance = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
